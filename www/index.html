<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--PANEL);color:var(--TEXT);font:14px Consolas,"Courier New",monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{background:var(--GREEN_D);border-bottom:2px solid var(--AMBER_D);color:var(--AMBER);text-align:center;padding:5px;font-weight:700;font-size:11px;letter-spacing:1px}
.hero{background:var(--GREEN_D);text-align:center;padding:12px 6px;border-bottom:2px solid var(--AMBER_D)}
.hero h1{margin:0;font-size:34px;letter-spacing:10px;color:var(--AMBER)}.hero div{font-size:10px;font-weight:700;color:var(--DIM)}
.wrap{max-width:900px;margin:auto;padding:8px}
.box{border:2px solid var(--AMBER_D);background:var(--BG);border-radius:4px;margin:8px 0;position:relative;padding:14px 8px 8px}
.box>h3{position:absolute;top:-10px;left:12px;margin:0;background:var(--PANEL);padding:0 8px;font-size:12px;color:var(--AMBER);letter-spacing:1px}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:220px;height:130px;border:3px solid var(--DARK);background:var(--DARK) center/cover no-repeat;position:relative;cursor:pointer;border-radius:3px;overflow:hidden}
.card.sel{border-color:var(--c)}.card .mx{position:absolute;top:0;left:0;right:0;background:#001408cc;color:#8a9;font-size:11px;font-weight:700;padding:2px 5px}
.card .tt{position:absolute;bottom:0;left:0;right:0;background:#050e03d0;text-align:center;padding:3px 0}.card .tt b{display:block;font-size:14px;color:var(--c)}.card .tt small{font-size:10px;color:#9a9;font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:var(--GREEN_D);border-top:2px solid var(--AMBER_D);padding:8px;margin-top:10px}
button{font:700 13px Consolas,monospace;background:var(--GREEN_D);color:var(--TEXT);border:2px solid var(--GREEN);border-radius:5px;padding:9px 12px;cursor:pointer}
button.on{background:var(--GREEN);color:var(--BRT);border-color:var(--c,var(--AMBER))}button.a{background:var(--AMBER_D);color:var(--BRT);border-color:var(--AMBER)}
button.big{width:100%;padding:15px;font-size:17px;background:var(--AMBER_D);border-color:var(--AMBER);color:var(--BRT);margin:8px 0}
label{display:block;font-size:11px;color:var(--DIM);margin:5px 0 1px;font-weight:700}
input,select{width:100%;padding:11px 8px;background:var(--DARK);color:var(--CYANI);border:2px solid var(--AMBER_D);border-radius:6px;font:700 16px Consolas,monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:8px;background:var(--GREEN_D);padding:6px 8px;border-bottom:2px solid var(--AMBER_D)}.top b{color:var(--AMBER);flex:1;letter-spacing:1px}
.rb{margin:6px 0;border:2px solid var(--c)}.rb .h{background:var(--c);color:#000;font-weight:700;padding:5px 8px}.rb .in{background:var(--BG);padding:6px 4px}
.vals{display:flex;gap:4px}.vals>div{flex:1;min-width:0;padding:0 4px}.vals small{display:block;color:var(--DIM);font-size:11px;font-weight:700}
.vals b{display:block;background:var(--DARK);color:var(--NUM);font-size:var(--fs,22px);padding:1px 4px;white-space:nowrap;overflow:hidden}
.ft{background:var(--FT);border-top:2px solid var(--c)}.ft .t{background:var(--FT2);color:var(--FTT);padding:5px 8px;font-weight:700;font-size:12px}
.ft .vals b{background:transparent;--fs:28px}.ft .vals small{font-size:12px}.ft u{text-decoration:none;font-size:11px;color:var(--DIM)}
.warn{color:var(--ORANGE);padding:6px 8px;font-weight:700}.hdrc{background:var(--GREEN_D);color:var(--AMBER);padding:6px 8px;font-weight:700;display:flex;justify-content:space-between}
.sub{padding:4px 8px;color:var(--AMBER);font-size:12px}canvas{width:100%;background:var(--DARK);border-radius:4px}
.hid{display:none}table{width:100%;border-collapse:collapse}td{padding:5px;border-bottom:1px solid var(--AMBER_D)}
.modal{position:fixed;inset:0;background:#000c;z-index:9;padding:20px;overflow:auto}.modal pre{background:var(--PANEL);color:var(--TEXT);padding:14px;border:2px solid var(--AMBER);white-space:pre-wrap;font-size:12px}
</style></head><body>

function conv(id){try{if(S.modes[id]=="geo"){const la=pg($(id+"_lat").value),lo=pg($(id+"_lon").value),[e,n,z]=l2u(la,lo);$(id+"_e").value=e.toFixed(1);$(id+"_n").value=n.toFixed(1);$(id+"_z").value=z;setMode(id,"utm")}else{const[la,lo]=u2l(+$(id+"_e").value,+$(id+"_n").value,+$(id+"_z").value);$(id+"_lat").value=dms(la);$(id+"_lon").value=dms(lo);setMode(id,"geo")}}catch(e){err(e)}}
function gp(id){const m=S.modes[id];if(m=="skip")return null;if(m=="geo")return[pg($(id+"_lat").value),pg($(id+"_lon").value)];const v=[$(id+"_e").value,$(id+"_n").value,$(id+"_z").value].map(x=>parseFloat(x.replace(",",".")));if(v.some(isNaN))throw id.toUpperCase()+": E/N/Zone manquants";return u2l(v[0],v[1],v[2])}
const nm=id=>{const v=parseFloat($(id).value.replace(",","."));if(isNaN(v))throw"Valeur manquante";return v};
const err=e=>alert("ERREUR : "+(e.message||e));
function openM(m){S.m=m;S.ex=[];S.modes={};S.zi=0;const col=MC[m],L={DRONE:"DRONE",TELEM:"TÉLÉMÈTRE",OC:"OBS. CROISÉE"}[m];
const am=D.AM[S.sys];S.fuse=am.fusees.default[0];S.obus=am.obus.default[0];
let b="";if(m=="DRONE")b=ptBlock("po","PO","Poste d'observation")+ptBlock("pt","PT","Position de tir")+ptBlock("tg","CIBLE","But (drone)","geo",false);
if(m=="TELEM")b=utmBlock("po","PO","Poste d'observation")+utmBlock("pt","PT","Position de tir")+`<div class="box"><h3>📡 BUT — COORDONNÉES POLAIRES</h3><div class="g2">${FLD("but_dist","DISTANCE (m)","")}${FLD("but_az","AZIMUT (mil)","")}</div></div>`;
if(m=="OC")b=utmBlock("po1","PO1","Premier poste")+utmBlock("po2","PO2","Deuxième poste")+utmBlock("pt","PT","Position de tir")+`<div class="box"><h3>🔭 AZIMUTS VERS LE BUT</h3><div class="g2">${FLD("az1","AZIMUT PO1 (mil)","Ex: 3200")}${FLD("az2","AZIMUT PO2 (mil)","Ex: 2800")}</div></div>`;
$("menu").classList.add("hid");$("app").classList.remove("hid");$("app").style.setProperty("--c",col);
$("app").innerHTML=`<div class="top"><button onclick="back()">◀ MENU</button><b>EAAC — ${L}</b></div><div class="wrap">
<div class="box"><h3>🔫 SYSTÈME D'ARTILLERIE</h3><div class="row" id="sb"></div><label>CHARGE (info)</label><select id="chg" onchange="inf()"></select><label>FUSÉE</label><select id="fus" onchange="S.fuse=this.value"></select><label>OBUS</label><select id="obs" onchange="S.obus=this.value"></select><div id="inf" class="sub"></div></div>
<div class="box"><h3>PARAMÈTRES</h3><div class="g2">${FLD("adp","ALPHA DP (mil)","0")}<div><label>NOM DE LA CIBLE</label><input id="tn" placeholder="BUT" style="color:var(--AMBER)"></div></div></div>
${b}<div class="box"><h3>💥 ÉCLATEMENTS</h3><div id="exl"></div><button class="a" onclick="addEx()">+ AJOUTER UN ÉCLATEMENT</button></div>
<button class="big" onclick="calc()">▶ CALCULER</button><div id="res"></div></div>`;sysUI()}
function back(){$("app").classList.add("hid");$("menu").classList.remove("hid");buildMenu()}
function sysUI(){$("sb").innerHTML=Object.keys(T).map(k=>`<button class="${k==S.sys?'on':''}" style="--c:${SC[k]};flex:1" onclick="S.sys='${k}';const a=D.AM[S.sys];S.fuse=a.fusees.default[0];S.obus=a.obus.default[0];sysUI()">${k}</button>`).join("");
$("chg").innerHTML=Object.keys(T[S.sys]).sort().map(c=>`<option>${c}</option>`).join("");const a=D.AM[S.sys];$("fus").innerHTML=a.fusees.default.map(x=>`<option>${x}</option>`).join("");$("obs").innerHTML=a.obus.default.map(x=>`<option>${x}</option>`).join("");inf()}
function inf(){const[a,b]=rg(S.sys,$("chg").value);$("inf").textContent=`Portée charge ${$("chg").value} : ${a}m — ${b}m`}
function addEx(){const i=S.ex.length+1;S.ex.push(i);let h=`<div class="box" style="margin-top:12px"><h3>ÉCLATEMENT ${i}</h3>`;
if(S.m=="DRONE"){S.modes["e"+i]="geo";h+=`<div class="row" id="e${i}_b"><button class="on" onclick="setMode('e${i}','geo')">GEO</button><button onclick="setMode('e${i}','utm')">UTM</button></div><div id="e${i}_g" class="g2">${FLD("e"+i+"_lat","LATITUDE","")}${FLD("e"+i+"_lon","LONGITUDE","")}</div><div id="e${i}_u" class="g3 hid">${FLD("e"+i+"_e","EASTING","")}${FLD("e"+i+"_n","NORTHING","")}${FLD("e"+i+"_z","ZONE","")}</div>`}
if(S.m=="TELEM")h+=`<div class="g2">${FLD("e"+i+"_d","DISTANCE (m) depuis PO","")}${FLD("e"+i+"_a","AZIMUT (mil)","")}</div>`;
if(S.m=="OC")h+=`<div class="g2">${FLD("e"+i+"_a1","AZIMUT PO1 (mil)","")}${FLD("e"+i+"_a2","AZIMUT PO2 (mil)","")}</div>`;
$("exl").insertAdjacentHTML("beforeend",h+"</div>")}
// ---------- résultats ----------
const NS=(l,v,fs)=>`<div><small>${l}</small><b style="--fs:${fs}px">${v}</b></div>`,sg=(v,d=0)=>(v>=0?"+":"")+v.toFixed(d);
function rb(title,P,Q,col,po,tg,adp){const{dist,mil}=dap(...P,...Q),pb=pbut(mil,adp),ptb=title.includes("PT")&&!title.includes("ECLT"),po_=title.startsWith("PO"),ec=title.includes("ECLT");let v="",x="";
if(po_&&!ec)v=NS("DK",dist.toFixed(0)+" m",30)+NS("Gis (α BUT PO)",mil.toFixed(0)+" mil",30);
else if(po_&&ec)v=NS("D éclat PO",dist.toFixed(0)+" m",30)+NS("Gis éclat",mil.toFixed(0)+" mil",30);
else if(ptb===false&&ec)v=NS("D éclatement PT",dist.toFixed(0)+" m",30)+NS("Alpha éclat PT",mil.toFixed(0)+" mil",30);
else v=NS("DBT",dist.toFixed(0)+" m",24)+NS("α but PT",mil.toFixed(0)+" mil",24)+NS("pBT",sg(pb),24);
if(ptb&&po&&tg){const q=dap(...po,...tg);let ps=Math.round(q.mil-mil);ps=w3(ps);x=`<div class="vals" style="border-top:1px solid var(--AMBER_D);padding-top:4px;margin-top:4px">${NS("Ps",sg(ps)+" mil",24)}${NS("KY",(dist>0?q.dist/dist:0).toFixed(2),24)}</div>`}
S.pbt=pb;return`<div class="rb" style="--c:${col}"><div class="h">▶ ${title}</div><div class="in"><div class="vals">${v}</div>${x}</div>${ptb?ft(dist,col):""}</div>`}
function ft(dist,col){const s=S.sys;let c=autoC(s,dist);if(!c)c=Object.keys(T[s]).sort().pop();const r=ik(s,c,dist),ok=r&&r[1]!=null&&r[2]!=null;
if(!ok){const cp=comp(s,dist);return`<div class="ft" style="--c:${col}"><div class="t">🎯 TABLE DE TIR — ${s} | Ch.${c} (AUTO)</div><div class="warn">⚠ Portée ${dist.toFixed(0)}m hors tableau (${s})${cp.length?"<br>Charges compatibles : "+cp.sort().join(", "):""}</div></div>`}
S.zi=r[2];S.last={c,h:r[1],z:r[2],dx:r[3],pbc:S.pbt+r[2]};const pbc=S.pbt+r[2];
return`<div class="ft" style="--c:${col}"><div class="t">🎯 TABLE DE TIR — ${s} | Ch.${c} (AUTO)</div><div class="vals" style="padding:6px 4px">${NS("CHARGE","Ch. "+c,16)}${NS("OBUS",(S.obus||"—").slice(0,22),13)}${NS("FUSÉE",(S.fuse||"—").slice(0,22),13)}</div><div class="vals" style="padding:4px 4px 8px">${NS("HAUSSE",r[1].toFixed(0)+"<u> mil</u>")}${NS("pBC",sg(pbc,1)+"<u> mil</u>")}${NS("Z",sg(r[2],1)+"<u> mil</u>")}${NS("ΔX/100m",(r[3]??0).toFixed(2)+"<u> mil</u>")}</div></div>`}
function cb(i,c){const a=c.dD<0?"RACCOURCIR":c.dD>0?"ALLONGER":"OK",b=c.dP>0?"DROITE":c.dP<0?"GAUCHE":"OK";
return`<div class="rb" style="--c:var(--CYAN)"><div class="h">● CORRECTION — ÉCLATEMENT ${i}</div><div class="in"><div class="vals">${NS("ΔD",sg(c.dD)+"<u> → "+a+"</u>",36)}${NS("ΔP",sg(c.dP)+"<u> → "+b+"</u>",36)}</div><div class="vals" style="margin-top:6px">${NS("D BUT",c.db.toFixed(0)+"m",15)}${NS("D ECLT",c.de.toFixed(0)+"m",15)}${NS("MIL BUT",c.mb.toFixed(0),15)}${NS("MIL ECLT",c.me.toFixed(0),15)}</div></div></div>`}
function calc(){try{const m=S.m;let PO,PT,TG,PO2,adp=parseFloat($("adp").value.replace(",","."))||0,ec=[];
if(m=="DRONE"){PO=gp("po");PT=gp("pt");TG=gp("tg");if(!TG)throw"Saisir les coordonnées de la cible"}
if(m=="TELEM"){PO=gp2("po");PT=gp2("pt");TG=polar(...PO,nm("but_dist"),nm("but_az"))}
if(m=="OC"){PO=gp2("po1");PO2=gp2("po2");PT=gp2("pt");TG=inter(...PO,nm("az1"),...PO2,nm("az2"));if(!TG)throw"Azimuts parallèles — pas d'intersection"}
S.ex.forEach(i=>{try{let c=null;if(m=="DRONE")c=gp("e"+i);if(m=="TELEM")c=polar(...PO,nm("e"+i+"_d"),nm("e"+i+"_a"));if(m=="OC")c=inter(...PO,nm("e"+i+"_a1"),...PO2,nm("e"+i+"_a2"));if(c)ec.push([i,c])}catch(e){}});
const name=($("tn").value||"BUT").toUpperCase(),ts=new Date().toISOString().slice(11,19);let h=`<div class="hdrc"><span>CIBLE${m=="OC"?" OC":""} : ${name}  ${ts} UTC</span><span style="color:var(--FTT)">${S.sys}  Ch.${S.last?S.last.c:"—"}</span></div><div class="sub">Alpha DP = ${adp.toFixed(0)} mil   |   Z (Dérive) = ${(S.zi||0).toFixed(2)} mil</div>`;
const O="var(--ORANGE)",A="var(--AMBER)";S.last=null;
if(m=="OC"){h+=rb("PO1 -> CIBLE",PO,TG,A,0,0,adp)+rb("PO2 -> CIBLE",PO2,TG,A,0,0,adp)+rb("PT -> CIBLE",PT,TG,A,PO,TG,adp)}
else{if(PO)h+=rb("PO -> CIBLE",PO,TG,A,0,0,adp);if(PT)h+=rb("PT -> CIBLE",PT,TG,A,PO,TG,adp)}
const first=S.last;ec.forEach(([i,c])=>{h+=`<div style="background:#1a0800;color:var(--ORANGE);font-weight:700;padding:4px 8px;margin-top:8px">ÉCLATEMENT ${i}</div>`;if(PO&&m!="OC")h+=rb(`PO -> ECLT ${i}`,PO,c,O,0,0,adp);if(PT){h+=rb(`PT -> ECLT ${i}`,PT,c,O,PO,c,adp);if(m!="OC"||1)h+=cb(i,corr(PT,TG,c))}});
S.last=first;h+=`<div class="row"><button class="a" style="flex:1" onclick="saveT()">💾 SAUVEGARDER</button><button style="flex:1" onclick="$('cr').classList.toggle('hid');drawC()">🗺 CROQUIS</button></div><button style="width:100%;margin-top:6px;opacity:.6" onclick="alert('Hauteurs & Site (DEM) — prochaine étape')">HAUTEURS & SITE (charger DEM)</button><div id="cr" class="box hid"><h3>CROQUIS</h3><canvas id="cv" width="800" height="440"></canvas></div>`;
S.cur={name,PT,TG,PO,PO2,ec,adp,dist:dap(...PT,...TG),f:first};$("res").innerHTML=h;$("res").scrollIntoView({behavior:"smooth"})}catch(e){err(e)}}
function gp2(id){const v=[$(id+"_e").value,$(id+"_n").value,$(id+"_z").value].map(x=>parseFloat(x.replace(",",".")));if(v.some(isNaN))throw id.toUpperCase()+": E/N/Zone manquants";return u2l(v[0],v[1],v[2])}
function saveT(){const c=S.cur,f=c.f||{};S.H.push([new Date().toLocaleString("fr-FR"),c.name,S.sys,S.m,c.dist.dist.toFixed(0),c.dist.mil.toFixed(1),f.c||"",f.h??"",f.pbc?.toFixed(1)??"",c.TG[0].toFixed(6),c.TG[1].toFixed(6)]);localStorage.eaac_h=JSON.stringify(S.H);alert("Cible sauvegardée")}
function rh(){$("hist").innerHTML=S.H.length?"<table>"+S.H.map((r,i)=>`<tr><td>${i+1}. ${r[1]} <small>${r[2]} ${r[3]}<br>${r[0]}</small></td><td style="text-align:right;color:var(--NUM)">${r[4]} m · H ${r[7]}</td></tr>`).join("")+"</table>":"<small style='color:var(--DIM)'>Aucune cible sauvegardée.</small>"}
function clearH(){if(confirm("Vider l'historique ?")){S.H=[];delete localStorage.eaac_h;rh()}}
function expCSV(){const hd=["Date","Cible","Système","Méthode","DBT (m)","α but PT (mil)","Charge","Hausse","pBC","Lat but","Lon but"],a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[hd,...S.H].map(r=>r.join(";")).join("\n")],{type:"text/csv"}));a.download="EAAC_cibles.csv";a.click()}
function drawC(){const c=$("cv"),g=c.getContext("2d"),X=S.cur,P=[["PT",X.PT,"#5cd68a"],["BUT",X.TG,"#e0a526"]];if(X.PO)P.push(["PO",X.PO,"#4fc3f7"]);if(X.PO2)P.push(["PO2",X.PO2,"#4fc3f7"]);X.ec.forEach(([i,e])=>P.push(["ÉCL"+i,e,"#ff6b5e"]));
const ref=X.PT,U=P.map(p=>{const q=l2u(...ref),w=l2u(...p[1]);return[w[0]-q[0],w[1]-q[1]]}),xs=U.map(u=>u[0]),ys=U.map(u=>u[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys),sc=Math.min(700/Math.max(Mx-mx,50),360/Math.max(My-my,50)),cx=(Mx+mx)/2,cy=(My+my)/2,px=u=>[400+(u[0]-cx)*sc,220-(u[1]-cy)*sc];
g.clearRect(0,0,800,440);g.lineWidth=2;const ln=(a,b,col,d)=>{g.strokeStyle=col;g.setLineDash(d||[]);g.beginPath();g.moveTo(...px(U[a]));g.lineTo(...px(U[b]));g.stroke();g.setLineDash([])};ln(0,1,"#e0a526");P.forEach((p,i)=>{if(p[0].startsWith("PO"))ln(i,1,"#4fc3f7",[6,4]);if(p[0].startsWith("ÉCL"))ln(1,i,"#ff6b5e",[3,3])});
P.forEach((p,i)=>{const[x,y]=px(U[i]);g.fillStyle=p[2];g.beginPath();g.arc(x,y,7,0,7);g.fill();g.font="bold 16px monospace";g.fillText(p[0],x+10,y-8)});g.fillStyle="#93a58c";g.fillText("N ↑",760,24)}
applyTheme();buildMenu();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"));
</script></body></html>
